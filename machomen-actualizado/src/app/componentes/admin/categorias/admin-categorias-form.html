<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-0">
            <div class="card-header bg-white p-4 border-bottom">
                <h5 class="fw-bold mb-0">
                    <i class="fa-solid fa-tag me-2"></i> {{ isEdit ? 'Editar' : 'Nueva' }} Categoría
                </h5>
            </div>
            <div class="card-body p-4">
                <form (ngSubmit)="guardar()">
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">Nombre de la Categoría</label>
                        <input type="text" [(ngModel)]="categoria.descripcion" name="descripcion" 
                               class="form-control rounded-0" placeholder="Ej: Calzado, Accesorios..." required>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a routerLink="/admin/categorias" class="btn btn-outline-secondary rounded-0 px-4">Cancelar</a>
                        <button type="submit" class="btn btn-dark rounded-0 px-4 fw-bold">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
