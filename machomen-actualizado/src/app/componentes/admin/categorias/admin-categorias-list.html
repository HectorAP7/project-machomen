<div class="card border-0 shadow-sm rounded-0">
    <div class="card-header bg-white p-4 border-bottom d-flex justify-content-between align-items-center">
        <div>
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-tags me-2"></i> Gestión de Categorías</h5>
            <small class="text-muted">Organiza las secciones de tu catálogo.</small>
        </div>
        <a routerLink="nuevo" class="btn btn-dark rounded-0 px-4 fw-bold">
            <i class="fa-solid fa-plus me-2"></i> Nueva Categoría
        </a>
    </div>

    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light text-secondary small text-uppercase">
                    <tr>
                        <th class="ps-4" style="width: 20%;">ID</th>
                        <th style="width: 60%;">Descripción / Nombre</th>
                        <th class="text-center" style="width: 20%;">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let c of categorias">
                        <td class="ps-4 fw-bold text-muted">#{{ c.idcategoria }}</td>
                        <td><span class="fw-bold text-dark">{{ c.descripcion }}</span></td>
                        <td class="text-center">
                            <a [routerLink]="['editar', c.idcategoria]" class="btn btn-outline-primary btn-sm border-0">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
