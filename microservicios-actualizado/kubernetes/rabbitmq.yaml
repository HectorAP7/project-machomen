apiVersion: apps/v1
kind: Deployment
metadata:
  name: machomen-rabbitmq
  namespace: machomen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: machomen-rabbitmq
  template:
    metadata:
      labels:
        app: machomen-rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: machomen-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: machomen-secrets
                  key: RABBITMQ_PASS
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: machomen-rabbitmq
  namespace: machomen
spec:
  selector:
    app: machomen-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
