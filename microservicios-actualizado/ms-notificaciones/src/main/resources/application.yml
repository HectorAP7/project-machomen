server:
  port: 8085

spring:
  application:
    name: ms-notificaciones

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jackson:
    time-zone: America/Lima

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

machomen:
  rabbitmq:
    exchange: machomen.direct.exchange
    queue:
      notificaciones: machomen.notificaciones.queue
    routing-key:
      boleta-nueva: boleta.nueva

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
